</div>

<div class="section">

      <text x="280" y="29" text-anchor="middle" fill="#ffdd00" font-size="10" font-weight="bold">WA/WM</text>
      <text x="280" y="58" text-anchor="middle" fill="#888" font-size="9">+1.27m</text>

      <circle cx="470" cy="57" r="6" fill="#4488ff" stroke="#1a2a1a" stroke-width="2"/>
      <text x="470" y="45" text-anchor="middle" fill="#4488ff" font-size="10" font-weight="bold">L</text>

      <!-- X-axis label -->
      <text x="400" y="198" text-anchor="middle" fill="#666" font-size="10">Distance along course (+X East)</text>
    </svg>
  </div>
  <p style="color:#999; margin-top:10px; font-size:13px;">Elevation varies ~2.7m across the course. Each zone model will be placed at its mesh surface Z to sit flush on the terrain.</p>
