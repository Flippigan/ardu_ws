<h2>Mission Sequencer State Machine</h2>
<p class="subtitle">Full FM-1 → FM-2 → FM-3 → RTH autonomous sequence</p>

<div class="section">
<svg viewBox="0 0 960 820" style="width:100%;max-width:960px;background:#1a1a2e;border-radius:12px;padding:20px;margin:0 auto;display:block">

  <!-- Title -->
  <text x="480" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" text-anchor="middle">Mission Sequencer State Machine</text>
  <text x="480" y="50" fill="#6b7280" font-size="11" text-anchor="middle">ABORT → LAND from any state (omitted for clarity). Pilot RC override always available.</text>

  <!-- IDLE -->
  <rect x="380" y="70" width="200" height="50" rx="25" fill="#1e293b" stroke="#6b7280" stroke-width="2"/>
  <text x="480" y="100" fill="#e5e7eb" font-size="14" font-weight="bold" text-anchor="middle">IDLE</text>
  <text x="480" y="65" fill="#6b7280" font-size="10" text-anchor="middle">Waiting for StartMission service call</text>

  <!-- Arrow IDLE -> PREFLIGHT -->
  <line x1="480" y1="120" x2="480" y2="145" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="560" y="138" fill="#4ade80" font-size="10">StartMission called</text>

  <!-- FM-1 Group -->
  <rect x="40" y="145" width="880" height="220" rx="8" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="55" y="165" fill="#4ade80" font-size="12" font-weight="bold">FM-1: Takeoff &amp; Land at L</text>

  <!-- PREFLIGHT_CHECK -->
  <rect x="380" y="175" width="200" height="44" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="195" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">PREFLIGHT_CHECK</text>
  <text x="480" y="207" fill="#9ca3af" font-size="9" text-anchor="middle">Verify armed, GPS lock, mode=GUIDED</text>

  <!-- Arrow -> TAKEOFF_H -->
  <line x1="480" y1="219" x2="480" y2="245" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- TAKEOFF_H -->
  <rect x="380" y="245" width="200" height="44" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="265" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">TAKEOFF_H</text>
  <text x="480" y="277" fill="#9ca3af" font-size="9" text-anchor="middle">Arm + takeoff to 35ft AGL</text>

  <!-- Arrow -> TRANSIT_H_TO_L -->
  <line x1="480" y1="289" x2="480" y2="310" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="560" y="305" fill="#9ca3af" font-size="9">alt ≥ 35ft AGL (rangefinder)</text>

  <!-- TRANSIT_H_TO_L -->
  <rect x="380" y="310" width="200" height="44" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="330" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">TRANSIT_H_TO_L</text>
  <text x="480" y="342" fill="#9ca3af" font-size="9" text-anchor="middle">GUIDED to L GPS @ 35ft AGL</text>

  <!-- Arrow -> LAND_L -->
  <line x1="580" y1="332" x2="720" y2="332" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="650" y="325" fill="#9ca3af" font-size="9">within position tolerance</text>

  <!-- LAND_L -->
  <rect x="720" y="310" width="200" height="44" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="820" y="330" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">LAND_L</text>
  <text x="820" y="342" fill="#9ca3af" font-size="9" text-anchor="middle">Switch LAND mode, vertical descent</text>

  <!-- FM-2 Group -->
  <rect x="40" y="375" width="880" height="170" rx="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="55" y="395" fill="#ef4444" font-size="12" font-weight="bold">FM-2: Drop Red Payloads</text>

  <!-- WAIT_FLAGGER -->
  <rect x="380" y="405" width="200" height="44" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="480" y="425" fill="#f97316" font-size="12" font-weight="bold" text-anchor="middle">WAIT_FLAGGER</text>
  <text x="480" y="437" fill="#9ca3af" font-size="9" text-anchor="middle">Waiting for ResumeMission svc call</text>

  <!-- Arrow from LAND_L to WAIT_FLAGGER -->
  <path d="M820,354 L820,390 L580,390 L580,405" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="700" y="385" fill="#9ca3af" font-size="9">vehicle landed/disarmed</text>

  <!-- Arrow -> TAKEOFF_L -->
  <line x1="480" y1="449" x2="480" y2="470" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="570" y="465" fill="#f97316" font-size="9">ResumeMission received</text>

  <!-- TAKEOFF_L -->
  <rect x="380" y="470" width="200" height="44" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="490" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">TAKEOFF_L</text>
  <text x="480" y="502" fill="#9ca3af" font-size="9" text-anchor="middle">Arm + takeoff to 35ft AGL</text>

  <!-- Arrow -> TRANSIT_L_TO_DROP -->
  <line x1="580" y1="492" x2="720" y2="492" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- TRANSIT_L_TO_DROP -->
  <rect x="720" y="470" width="200" height="44" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="820" y="490" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">TRANSIT_TO_DROP</text>
  <text x="820" y="502" fill="#9ca3af" font-size="9" text-anchor="middle">GUIDED to F1/F2 GPS @ 35ft</text>

  <!-- Arrow -> DROP_PAYLOAD -->
  <path d="M820,514 L820,545" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="870" y="535" fill="#9ca3af" font-size="9">over target</text>

  <!-- FM-3 Group -->
  <rect x="40" y="555" width="880" height="170" rx="8" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="55" y="575" fill="#eab308" font-size="12" font-weight="bold">FM-3: Pickup Yellow Payloads from WA &amp; Re-drop</text>

  <!-- DROP_PAYLOAD (FM-2) -->
  <rect x="720" y="545" width="200" height="44" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="820" y="565" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">DROP_PAYLOAD</text>
  <text x="820" y="577" fill="#9ca3af" font-size="9" text-anchor="middle">DO_SET_SERVO to release</text>

  <!-- Arrow -> TRANSIT_TO_WA -->
  <path d="M720,567 L580,567 L580,585" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="650" y="560" fill="#9ca3af" font-size="9">servo actuated</text>

  <!-- TRANSIT_TO_WA -->
  <rect x="380" y="585" width="200" height="44" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="480" y="605" fill="#eab308" font-size="12" font-weight="bold" text-anchor="middle">TRANSIT_TO_WA</text>
  <text x="480" y="617" fill="#9ca3af" font-size="9" text-anchor="middle">GUIDED to WA GPS @ 35ft</text>

  <!-- Arrow -> LAND_WA -->
  <line x1="480" y1="629" x2="480" y2="650" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- LAND_WA -->
  <rect x="380" y="650" width="200" height="44" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="480" y="670" fill="#eab308" font-size="12" font-weight="bold" text-anchor="middle">LAND_WA</text>
  <text x="480" y="682" fill="#9ca3af" font-size="9" text-anchor="middle">StartPrecisionLanding → AprilTag</text>

  <!-- Arrow -> TAKEOFF_WA -->
  <path d="M580,672 L720,672" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="650" y="665" fill="#9ca3af" font-size="9">LANDED confirmed</text>

  <!-- TAKEOFF_WA -->
  <rect x="720" y="650" width="200" height="44" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="820" y="670" fill="#eab308" font-size="12" font-weight="bold" text-anchor="middle">TAKEOFF_WA</text>
  <text x="820" y="682" fill="#9ca3af" font-size="9" text-anchor="middle">Arm + takeoff to 35ft AGL</text>

  <!-- Arrow -> TRANSIT_TO_DROP_2 -->
  <path d="M820,694 L820,720" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- TRANSIT_TO_DROP_2 -->
  <rect x="720" y="720" width="200" height="44" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="820" y="740" fill="#eab308" font-size="12" font-weight="bold" text-anchor="middle">TRANSIT_TO_DROP_2</text>
  <text x="820" y="752" fill="#9ca3af" font-size="9" text-anchor="middle">GUIDED to F1/F2 GPS @ 35ft</text>

  <!-- Arrow -> DROP_PAYLOAD_2 -->
  <path d="M720,742 L580,742" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- DROP_PAYLOAD_2 -->
  <rect x="380" y="720" width="200" height="44" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="480" y="740" fill="#eab308" font-size="12" font-weight="bold" text-anchor="middle">DROP_PAYLOAD_2</text>
  <text x="480" y="752" fill="#9ca3af" font-size="9" text-anchor="middle">DO_SET_SERVO to release</text>

  <!-- RTH Group -->
  <rect x="40" y="775" width="440" height="40" rx="8" fill="none" stroke="#9333ea" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="55" y="793" fill="#9333ea" font-size="12" font-weight="bold">Return Home</text>

  <!-- Arrow -> TRANSIT_TO_H -->
  <path d="M380,742 L280,742 L280,790" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- TRANSIT_TO_H -->
  <rect x="140" y="775" width="170" height="36" rx="6" fill="#1e293b" stroke="#9333ea" stroke-width="2"/>
  <text x="225" y="797" fill="#9333ea" font-size="12" font-weight="bold" text-anchor="middle">TRANSIT_TO_H</text>

  <!-- Arrow -> LAND_H -->
  <line x1="310" y1="793" x2="360" y2="793" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- LAND_H -->
  <rect x="360" y="775" width="110" height="36" rx="6" fill="#1e293b" stroke="#9333ea" stroke-width="2"/>
  <text x="415" y="797" fill="#9333ea" font-size="12" font-weight="bold" text-anchor="middle">LAND_H</text>

  <!-- COMPLETE -->
  <text x="415" y="825" fill="#9ca3af" font-size="9" text-anchor="middle">→ COMPLETE</text>

  <!-- ABORT box -->
  <rect x="55" y="470" width="140" height="44" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="125" y="490" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">ABORT</text>
  <text x="125" y="502" fill="#fca5a5" font-size="9" text-anchor="middle">LAND mode immediately</text>
  <text x="125" y="530" fill="#6b7280" font-size="9" text-anchor="middle">From ANY state on</text>
  <text x="125" y="542" fill="#6b7280" font-size="9" text-anchor="middle">timeout or failure</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ade80"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#eab308"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9333ea"/></marker>
  </defs>
</svg>
</div>
